<!doctype html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Simple Rock Paper Scissors Game</title>
    </head>

    <body>
        <header>
            <h1>Welcome to my Rock/Paper/Scissors game</h1>
        </header>
        <div class="content">
            <label for="number-of-rounds" id="rounds">
                Number of rounds
                <input id="number-of-rounds" type="number" min="1" max="10"/>
            </label>
            <div class="picks-block">
                <h2>Choose:</h2>
                <div class="picks">
                    <input type="button" value="Rock" id="rock">
                    <input type="button" value="Paper" id="paper">
                    <input type="button" value="Scissors" id="scissors">
                </div>
                

                <div class="score-block">
                    <p id="player-score">player score:</p>
                    <p id="computer-score">computer score:</p>
                    <p hidden id="final-score">final score:</p>
                </div>
                
            </div>
        </div>
    </body>
</html>
